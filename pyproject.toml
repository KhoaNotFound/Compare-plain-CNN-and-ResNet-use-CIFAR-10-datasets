[project]
name = "img-classification"
version = "0.1.0"
description = "Reproducible CIFAR-10 training locally and on Kaggle GPU"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=3,<6",
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "torch>=2.4",
    "pillow>=10",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
[project.scripts]
img-prepare = "img_classification.prepare_data:main"
img-train = "img_classification.train:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
